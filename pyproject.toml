[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifs-code-interpreter"
version = "0.1.0"
description = "Source-grounded questions and answers about International Futures code"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ifs-code-interpreter = "ifs_code_interpreter:main"

[tool.setuptools]
package-dir = {"" = "tool"}
py-modules = ["ifs_code_interpreter"]
